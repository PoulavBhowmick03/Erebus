[project]
name = "erebus-agents"
version = "0.2.0"
description = "Reference agents demonstrating the offer/counter/accept loop"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.2.0", "erebus-mcp-server"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erebus_agents"]

[tool.uv.sources]
erebus-mcp-server = { workspace = true }
