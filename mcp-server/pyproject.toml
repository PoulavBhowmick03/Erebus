[project]
name = "erebus-mcp-server"
version = "0.2.0"
description = "MCP server exposing Erebus tools to any agent framework"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "erebus-sdk",
]

[project.scripts]
erebus-mcp-server = "erebus_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erebus_mcp"]

[tool.uv.sources]
erebus-sdk = { workspace = true }
