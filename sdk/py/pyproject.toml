[project]
name = "erebus-sdk"
version = "0.0.0"
description = "Python client for Erebus — agent-framework facing"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erebus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
