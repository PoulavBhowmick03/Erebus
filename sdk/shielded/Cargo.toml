[package]
name = "erebus-shielded-prover"
version = "0.1.0"
edition = "2021"
description = "Local, hash-checked Circom Groth16 proving for the experimental Erebus EVM pool"
license = "Apache-2.0"

[dependencies]
erebus-core = { path = "../core" }
hex = "0.4"
chacha20poly1305 = "0.10.1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
sha3 = "0.10"
ark-bn254 = "0.5"
ark-circom = "=0.5.0"
ark-crypto-primitives = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-std = "0.5"
num-bigint = "0.4"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "deny"

[dev-dependencies]
tempfile = "3"
