[package]
name = "erebus-shielded-prover"
version = "0.1.0"
edition = "2021"
description = "Local, hash-checked Circom Groth16 proving for the experimental Erebus EVM pool"
license = "Apache-2.0"

[dependencies]
erebus-core = { path = "../core" }
erebus-coordinator = { path = "../coordinator" }
erebus-evm = { path = "../evm" }
erebus-journal = { path = "../journal" }
erebus-transport = { path = "../transport" }
hex = "0.4"
base64 = "0.22"
chacha20poly1305 = "0.10.1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
sha3 = "0.10"
ark-bn254 = "0.6"
ark-circom = "=0.6.0"
ark-crypto-primitives = "0.6"
ark-ff = "0.6"
ark-groth16 = "0.6"
ark-std = "0.6"
num-bigint = "0.4"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "deny"

[dev-dependencies]
tokio-stream = "0.1"

[[bin]]
name = "erebus-shielded-disclosure"
path = "src/bin/erebus_shielded_disclosure.rs"

[[bin]]
name = "erebus-artifacts"
path = "src/bin/erebus_artifacts.rs"

[[bin]]
name = "erebus-local-prove"
path = "src/bin/erebus_local_prove.rs"

[[bin]]
name = "erebus-access-service"
path = "src/bin/erebus_access_service.rs"

[[bin]]
name = "erebus-access"
path = "src/bin/erebus_access.rs"

[[bin]]
name = "erebus-negotiate"
path = "src/bin/erebus_negotiate.rs"

[[bin]]
name = "erebus-payment"
path = "src/bin/erebus_payment.rs"
