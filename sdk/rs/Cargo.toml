[package]
name = "erebus-sdk"
version = "0.0.1"
edition = "2021"
description = "Rust client for Erebus: private agent coordination on STRK20"
license = "Apache-2.0"

[dependencies]
# Felt252 and Stark-curve arithmetic. Published, unlike the software-mansion fork
# that starknet-privacy's own crates pin by git rev.
starknet-types-core = { version = "0.2", features = ["curve", "serde"] }
# Poseidon and Stark ECDSA.
starknet-crypto = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async HTTP for the proving service and RPC. Decided 2026-07-28 (ARCHITECTURE §3).
# rustls rather than native-tls: no OpenSSL in the build, which keeps cross-compilation
# and any future PyO3 wheel tractable.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Entropy for channel randoms and note salts. Deliberately generated in Rust: if the
# Python binding supplied it, sdk/py would be making a cryptographic decision, which is
# exactly what it is forbidden to do.
rand = "0.8"
# Starknet entrypoint selectors are Starknet-keccak(name).
sha3 = "0.10"
# Wire v2 encrypts the 400-bit negotiation record before it enters public note salts.
# AES-GCM-SIV is nonce-misuse resistant: a failed attempt may be rebuilt with different
# terms at the same note index before the chain's WriteOnce rule has taken effect.
aes-gcm-siv = "0.11"
hkdf = "0.12"
sha2 = "0.10"
# A one-shot CLI can have concurrent callers. Advisory locks keep a channel's cursor
# single-writer across processes.
fs2 = "0.4"

[[bin]]
name = "erebus-cli"
path = "src/bin/erebus_cli.rs"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "deny"
