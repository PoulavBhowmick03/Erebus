[package]
name = "erebus-evm"
version = "0.1.0"
edition = "2021"
description = "EVM public-bound settlement adapter for Erebus: authorized agreement to on-chain payment"
license = "Apache-2.0"

[dependencies]
# Chain-neutral agreement core: canonical terms encoding, commitment, authorizations, and the
# settlement capability types this adapter fills in. The adapter must not duplicate any of it.
erebus-core = { path = "../core" }
# The Rust EVM client: JSON-RPC, local transaction signing, nonce and gas filling, receipts.
# Selected as the maintained successor to ethers-rs (see docs/metropolis-m3-decisions.md).
alloy = { version = "1", features = [
    "provider-http",
    "signer-local",
    "network",
    "rpc-types-eth",
    "consensus",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Function selectors and the digest the contract recomputes.
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
# Tests sign buyer and seller authorizations with the suite-1 algorithms.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "deny"
