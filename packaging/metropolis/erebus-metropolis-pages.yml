# Template for PoulavBhowmick03/erebus-metropolis: copy to .github/workflows/pages.yml in that
# repository. It builds the hash-pinned PEP 503 index from the release assets and deploys it
# under the required github-pages environment. The Erebus build workflow dispatches here only
# when publish=true; this file itself never builds or signs anything.
name: Metropolis package index

on:
  repository_dispatch:
    types: [metropolis-registry]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.3.0.dev20261004"
        required: true

permissions:
  contents: read

jobs:
  publish-index:
    name: Build and deploy the index
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - name: Download every published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The index covers all published versions, so a new release never makes an older
          # pinned version uninstallable. Drafts are never indexed.
          gh release list --repo PoulavBhowmick03/erebus-metropolis --limit 1000 \
            --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' > tags.txt
          grep -qx "$TAG" tags.txt || { echo "dispatched tag $TAG is not a published release"; exit 1; }
          while read -r tag; do
            mkdir -p "releases/$tag"
            gh release download "$tag" --repo PoulavBhowmick03/erebus-metropolis \
              --dir "releases/$tag" --pattern '*.whl' --pattern 'release-manifest.json'
          done < tags.txt
      - name: Build the hash-pinned index from the manifests
        run: |
          python3 - <<'PY'
          import hashlib, html, json, pathlib, sys

          projects: dict[str, dict[str, tuple[str, str]]] = {}
          for release in sorted(pathlib.Path("releases").iterdir()):
              tag = release.name
              manifest = json.loads((release / "release-manifest.json").read_text())
              if manifest.get("tag") != tag:
                  sys.exit(f"{tag}: release manifest names a different tag")
              platforms = manifest.get("platforms", {})
              if len(platforms) < 2:
                  sys.exit(f"{tag}: expected two platform manifests, found {len(platforms)}")
              tags = {p: m.get("platform_qualification", {}).get("wheel_tag") for p, m in platforms.items()}
              if len(set(tags.values())) != len(tags):
                  sys.exit(f"{tag}: platform qualifications are not distinct: {tags}")
              base = "https://github.com/PoulavBhowmick03/erebus-metropolis/releases/download/" + tag
              for data in platforms.values():
                  for name, meta in data["wheels"].items():
                      local = release / name
                      if not local.exists():
                          sys.exit(f"{tag}/{name}: missing release asset")
                      if hashlib.sha256(local.read_bytes()).hexdigest() != meta["sha256"]:
                          sys.exit(f"{tag}/{name}: manifest hash does not match the asset")
                      project = name.split("-")[0].replace("_", "-").lower()
                      previous = projects.setdefault(project, {}).get(name)
                      if previous and previous[1] != meta["sha256"]:
                          sys.exit(f"{name}: published twice with different contents")
                      projects[project][name] = (base, meta["sha256"])

          site = pathlib.Path("site/simple")
          site.mkdir(parents=True)
          (site / "index.html").write_text(
              "<!doctype html>\n"
              + "\n".join(f'<a href="{p}/">{p}</a><br>' for p in sorted(projects))
          )
          for project, files in projects.items():
              page = site / project
              page.mkdir()
              lines = [
                  f'<a href="{base}/{html.escape(name, quote=True)}#sha256={digest}">'
                  f"{html.escape(name)}</a><br>"
                  for name, (base, digest) in sorted(files.items())
              ]
              (page / "index.html").write_text("<!doctype html>\n" + "\n".join(lines))
          print(f"indexed {len(projects)} projects from {len(list(pathlib.Path('releases').iterdir()))} releases")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: pages
