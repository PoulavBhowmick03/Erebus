[project]
name = "erebus-cli"
version = "0.0.1"
description = "Ships the erebus-cli binary. No Python code, no protocol logic."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The binding resolves the binary with `shutil.which("erebus-cli")`, so it has to land on
# PATH. `shared-scripts` puts it in the wheel's `.data/scripts/` directory, which the
# installer copies into the environment's bin directory.
packages = ["src/erebus_cli"]

[tool.hatch.build.targets.wheel.shared-scripts]
"bin/erebus-cli" = "erebus-cli"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# A source distribution cannot carry a compiled binary for a platform it does not know, and
# there is nothing to compile from Python. Publishing one would install cleanly and then
# fail at the first call with "erebus-cli not found on PATH".
exclude = ["*"]
