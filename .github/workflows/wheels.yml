name: Wheels

# Builds one platform wheel per target, each carrying an `erebus-cli` compiled for that
# target. The Python binding resolves the binary with `shutil.which`, so the wheel installs
# it into the environment's script directory rather than importing it.
#
# Runs on demand and on a version tag. Not on every push: cross-builds per commit are a lot
# of CI time for an artifact nobody consumes until a release.
#
# Intel macOS (`x86_64-apple-darwin`) is deliberately absent. It built on a `macos-13`
# runner, which stopped being assigned: two dispatches in August 2026 got zero steps, one
# sitting queued until it was cancelled at 24h. Cross-compiling it from the arm64 runner
# would produce a wheel this workflow could not execute on its own architecture, and
# shipping an unexecuted binary is worse than shipping none. Decided 2026-08-19: Intel Macs
# are unsupported for now, stated in the release notes rather than half-built here.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    name: Release readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate versions, tag, release text, and mainnet evidence
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            python3 scripts/check-release-readiness.py \
              --version "$version" \
              --tag "$GITHUB_REF_NAME" \
              --require-mainnet
          else
            python3 scripts/check-release-readiness.py
          fi

  wheel:
    name: ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            # manylinux, not the runner's own libc version. A wheel tagged with the build
            # machine's glibc would refuse to install on anything older.
            wheel_platform: manylinux_2_17_x86_64.manylinux2014_x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            wheel_platform: macosx_11_0_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rs
          key: ${{ matrix.target }}

      - uses: astral-sh/setup-uv@v5

      - name: Build erebus-cli
        run: |
          cargo build --release \
            --bin erebus-cli \
            --target ${{ matrix.target }} \
            --manifest-path sdk/rs/Cargo.toml

      - name: Stage the binary
        run: |
          mkdir -p packaging/erebus-cli/bin
          cp "sdk/rs/target/${{ matrix.target }}/release/erebus-cli" \
             packaging/erebus-cli/bin/erebus-cli
          chmod +x packaging/erebus-cli/bin/erebus-cli

      - name: Check the binary runs
        # A cross-built binary that cannot execute is only detectable here. Skipped for the
        # x86-64 macOS wheel, which is built on an x86-64 runner, so this always runs.
        run: echo '{"method":"version"}' | packaging/erebus-cli/bin/erebus-cli

      - name: Build the wheel
        working-directory: packaging/erebus-cli
        env:
          EREBUS_WHEEL_PLATFORM: ${{ matrix.wheel_platform }}
        # --out-dir is not optional: this is a uv workspace member, so without it the wheel
        # lands in the workspace root's dist/ and every path below misses it.
        run: uv build --wheel --out-dir dist

      - name: Check the wheel is not tagged `any`
        # A wheel carrying a compiled binary tagged `py3-none-any` would install on every
        # platform and fail at the first call. The build hook forces the tag; this checks
        # the hook actually ran.
        run: |
          for w in packaging/erebus-cli/dist/*.whl; do
            echo "built: $w"
            case "$w" in
              *none-any.whl)
                echo "::error::$w is platform-independent but carries a binary"
                exit 1
                ;;
            esac
          done

      - name: Install it into a clean environment and call it
        run: |
          uv venv /tmp/canary
          uv pip install --python /tmp/canary/bin/python packaging/erebus-cli/dist/*.whl
          test -x /tmp/canary/bin/erebus-cli \
            || { echo "::error::the binary did not land on PATH"; exit 1; }
          echo '{"method":"version"}' | /tmp/canary/bin/erebus-cli

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: packaging/erebus-cli/dist/*.whl
          if-no-files-found: error

      - name: Stage the raw binary
        # A wheel only helps Python callers. Anything else -- a TypeScript agent, Go, a
        # shell script -- talks to erebus-cli over stdin and stdout and should not have to
        # install a Python package to extract a binary from it.
        run: |
          mkdir -p raw
          cp packaging/erebus-cli/bin/erebus-cli "raw/erebus-cli-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: raw/*
          if-no-files-found: error

  pure:
    name: Pure-Python wheels
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build erebus-sdk and erebus-mcp-server
        # These carry no binary, so one wheel each serves every platform. An operator needs
        # all three packages: erebus-mcp-server depends on erebus-sdk, which depends on
        # erebus-cli. Shipping only the binary leaves the chain unresolvable.
        run: |
          uv build --wheel --out-dir "$PWD/dist" sdk/py
          uv build --wheel --out-dir "$PWD/dist" mcp-server
          ls -1 dist/

      - name: These must be platform-independent
        # The mirror of the check on the binary wheels. A pure package that somehow picked
        # up a platform tag would be uninstallable everywhere else.
        run: |
          for w in dist/*.whl; do
            case "$w" in
              *none-any.whl) echo "ok: $w" ;;
              *) echo "::error::$w should be platform-independent"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-pure
          path: dist/*.whl
          if-no-files-found: error

  collect:
    name: Collect, checksum, and bill of materials
    runs-on: ubuntu-latest
    needs: [wheel, pure]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Every wheel the install chain needs is present
        # A cross-build that fails leaves the others green, and a release missing a piece is
        # only noticed by the person who cannot install it.
        run: |
          missing=0
          for tag in manylinux macosx_11_0_arm64; do
            compgen -G "dist/*${tag}*.whl" >/dev/null \
              || { echo "::error::no erebus-cli wheel for $tag"; missing=1; }
          done
          for pkg in erebus_sdk erebus_mcp_server; do
            compgen -G "dist/${pkg}-*.whl" >/dev/null \
              || { echo "::error::no wheel for $pkg"; missing=1; }
          done
          exit $missing

      - name: Software bill of materials
        run: |
          python3 scripts/sbom.py --check
          python3 scripts/sbom.py > dist/sbom.json

      - name: Checksum
        run: |
          cd dist
          artifacts=(./*.whl ./erebus-cli-* ./sbom.json)
          sha256sum -- "${artifacts[@]}" | tee SHA256SUMS
          echo "--- release artifacts ---"
          ls -1

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  release:
    name: Create the draft release
    runs-on: ubuntu-latest
    needs: collect
    # Only for a tag. A manual run builds and verifies without publishing anything.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Create the release
        # The preamble carries the statements every pre-1.0 release must make: unaudited,
        # evidence-bounded mainnet status, relationship privacy incomplete, and platforms
        # supported. It is prepended to the generated notes rather than written per
        # release, because a required statement that has to be remembered each time is one
        # that eventually gets forgotten. Two steps rather than combining --notes-file with
        # --generate-notes, whose precedence is not something to guess at during a release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/check-release-readiness.py \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --require-mainnet

          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            --verify-tag

          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --json body -q .body > /tmp/generated-notes.md
          cat docs/release-preamble.md /tmp/generated-notes.md > /tmp/release-notes.md
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --notes-file /tmp/release-notes.md

          # Keep the draft blocked if the notes lost a required statement.
          body=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
                 --json body -q .body)
          for phrase in "unaudited" "not the relationship" \
                        "Linux x86-64 and macOS arm64"; do
            case "$body" in
              *"$phrase"*) ;;
              *) echo "::error::release notes are missing: $phrase"; exit 1 ;;
            esac
          done

      - name: Keep the release gated on the clean-install canary
        run: |
          echo "Draft created. Do not publish it until the Canary workflow passes."
          echo "Publishing the draft triggers the public-index deployment and published-package canary."
