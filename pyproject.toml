[project]
name = "erebus"
version = "0.1.0"
description = "Private coordination and settlement infrastructure for AI agents on Starknet"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.workspace]
members = ["sdk/py", "mcp-server", "agents", "packaging/erebus-cli"]

[tool.pytest.ini_options]
testpaths = ["sdk/py/tests", "mcp-server/tests", "agents/tests"]
